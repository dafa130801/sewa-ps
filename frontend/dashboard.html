<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Sewa PS</title>
  <!-- Masukkan link CSS kamu di sini jika ada -->
  <style>
    body { font-family: Arial, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    nav { display: flex; gap: 15px; margin-bottom: 25px; background: #1e293b; padding: 12px 20px; border-radius: 8px; align-items: center; }
    nav a { color: #38bdf8; text-decoration: none; font-weight: bold; }
    nav a:hover { text-decoration: underline; }
    .card { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    input, select { width: 100%; padding: 10px; margin: 8px 0 16px 0; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 4px; box-sizing: border-box; }
    button { background: #0284c7; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
    button:hover { background: #0ea5e9; }
    .console-card { background: #334155; padding: 15px; border-radius: 6px; margin-top: 10px; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge.tersedia { background: #10b981; color: white; }
    .badge.maintenance { background: #ef4444; color: white; }
    /* Styling Modal QRIS */
    #modalQris { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
    .modal-content { background: #1e293b; padding: 30px; border-radius: 8px; text-align: center; width: 90%; max-width: 400px; }
  </style>
</head>
<body>

  <!-- NAVBAR DENGAN KELAS ADMIN-ONLY -->
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="riwayat.html">Riwayat Sewa</a>
    <a href="units.html" class="admin-only">Kelola Unit</a>
    <a href="users.html" class="admin-only">Kelola User</a>
    <span id="infoUser" style="margin-left: auto; font-size: 14px; color: #94a3b8;"></span>
    <a href="#" onclick="logout()" style="color: #ef4444;">Keluar</a>
  </nav>

  <div class="card">
    <h2>Buat Transaksi Sewa Baru</h2>
    <form id="formSewa">
      <label for="consoleId">Pilih Unit Konsol (yang tersedia)</label>
      <select id="consoleId" required></select>
      
      <!-- Tempat Peringatan Bentrok / Info Jadwal -->
      <div id="jadwalUnit" style="margin-bottom: 15px; font-size: 14px;"></div>

      <label for="namaPenyewa">Nama Penyewa (kosongkan untuk pakai username Anda)</label>
      <input type="text" id="namaPenyewa" placeholder="Nama Penyewa">

      <label for="noHp">No. HP (opsional)</label>
      <input type="text" id="noHp" placeholder="08xxxxxxxxxx">

      <label for="jamMulai">Jam Mulai</label>
      <input type="datetime-local" id="jamMulai" required>

      <label for="durasiJam">Durasi (jam)</label>
      <input type="number" id="durasiJam" value="1" min="1" required>

      <div id="errorMsg" style="color: #ef4444; margin-bottom: 10px; font-size: 14px;"></div>
      <button type="submit">Mulai Sewa</button>
    </form>
  </div>

  <div class="card">
    <h2>Status Unit Konsol</h2>
    <div id="listConsole"></div>
  </div>

  <!-- Modal QRIS Pembayaran -->
  <div id="modalQris">
    <div class="modal-content">
      <h3>Selesaikan Pembayaran</h3>
      <p id="qrisTotal" style="font-size: 18px; font-weight: bold; color: #38bdf8;"></p>
      <p style="background: #334155; padding: 15px; border-radius: 6px; margin: 15px 0;">[ Simulasi Gambar QRIS ]</p>
      <p id="qrisStatus">Silakan scan & transfer sesuai total di atas.</p>
      <button onclick="tandaiSudahBayar()" style="background: #10b981; margin-bottom: 10px;">Saya Sudah Bayar</button>
      <button onclick="tutupModalQris()" style="background: #64748b;">Tutup</button>
    </div>
  </div>

  <!-- Script Pendukung -->
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
