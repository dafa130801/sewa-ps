<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Sewa PS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-box card p-4">
        <h3 class="text-center mb-4 text-white">🎮 Daftar Akun</h3>
        <form>
            <div class="mb-3">
                <label class="form-label text-white-50">Nama Lengkap</label>
                <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="Nama lengkap">
            </div>
            <div class="mb-3">
                <label class="form-label text-white-50">Username</label>
                <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="Username">
            </div>
            <div class="mb-3">
                <label class="form-label text-white-50">Password</label>
                <input type="password" class="form-control bg-dark text-white border-secondary" placeholder="Password">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Daftar</button>
        </form>
        <p class="text-center mt-3 text-white-50 small">Sudah punya akun? <a href="login.html" class="text-info text-decoration-none">Login di sini</a></p>
    </div>
</body>
</html>
